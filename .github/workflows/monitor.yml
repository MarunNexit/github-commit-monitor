name: Monitor DOTA2_CLIENT


on:

  schedule:
    # every 5 minutes
    - cron: "*/5 * * * *"


  # manual run button
  workflow_dispatch:



jobs:

  monitor:

    runs-on: ubuntu-latest


    permissions:
      contents: write


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"



      - name: Install dependencies
        run: |
          pip install -r requirements.txt



      - name: Run monitor

        env:

          ELITEA_WEBHOOK:
            ${{ secrets.ELITEA_WEBHOOK }}

          ELITEA_SECRET:
            ${{ secrets.ELITEA_SECRET }}


        run: |
          python monitor.py



      - name: Save commit state

        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add last_commit.json


          git commit -m "Update last commit state" || true


          git push