name: Monitor DOTA2_CLIENT


on:

  schedule:
    - cron: "*/3 * * * *"


  workflow_dispatch:


permissions:

  contents: read



jobs:

  monitor:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"



      - name: Install dependencies

        run: |

          pip install -r requirements.txt



      - name: Run monitor

        env:

          ELITEA_WEBHOOK: ${{ secrets.ELITEA_WEBHOOK }}

          ELITEA_SECRET: ${{ secrets.ELITEA_SECRET }}

          LAST_COMMIT_SHA: ${{ vars.LAST_COMMIT_SHA }}

        run: |

          python monitor.py



      - name: Update variable

        if: always()

        env:

          GH_TOKEN: ${{ secrets.GH_PAT }}

        run: |

          if [ -f new_sha.txt ]; then

            SHA=$(cat new_sha.txt)

            gh variable set LAST_COMMIT_SHA \
              --body "$SHA"

          fi