name: Monitor DOTA2_CLIENT


on:

  schedule:
    - cron: "*/5 * * * *"


  workflow_dispatch:



jobs:

  monitor:

    runs-on: ubuntu-latest


    permissions:
      contents: read
      actions: write



    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"



      - name: Install dependencies
        run: |
          pip install -r requirements.txt



      - name: Run monitor

        env:

          ELITEA_WEBHOOK:
            ${{ secrets.ELITEA_WEBHOOK }}

          ELITEA_SECRET:
            ${{ secrets.ELITEA_SECRET }}

          LAST_COMMIT_SHA:
            ${{ vars.LAST_COMMIT_SHA }}

          GITHUB_TOKEN:
            ${{ secrets.GITHUB_TOKEN }}


        run: |
          python monitor.py